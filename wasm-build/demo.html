<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dasher</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e; color: #eee;
            overflow: hidden;
        }
        #app {
            display: flex; flex-direction: column; height: 100vh; height: 100dvh;
        }
        .main-area {
            flex: 1; display: flex; gap: 8px; padding: 8px;
            min-height: 0;
        }
        .canvas-wrap {
            flex: 1; display: flex; flex-direction: column;
            background: #000; border-radius: 12px; overflow: hidden;
            position: relative;
        }
        canvas {
            flex: 1; display: block; cursor: crosshair; touch-action: none;
            width: 100%;
        }
        .canvas-stats {
            position: absolute; bottom: 8px; right: 12px;
            font-size: 11px; color: rgba(255,255,255,0.4);
            pointer-events: none;
        }
        .output-wrap {
            width: 280px; min-width: 200px; display: flex; flex-direction: column;
            background: #16213e; border-radius: 12px; padding: 12px;
        }
        .output-wrap h2 {
            margin: 0 0 8px 0; font-size: 13px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; color: #8a8a9a;
        }
        #output-text {
            flex: 1; width: 100%; border: none; background: transparent;
            color: #e0e0e0; font-size: 18px; font-family: inherit;
            resize: none; outline: none; line-height: 1.5;
        }
        #output-text::placeholder { color: #4a4a5a; }
        .controls {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            padding: 10px 12px; background: #16213e;
        }
        .control-group label {
            display: block; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px; color: #8a8a9a;
            margin-bottom: 4px;
        }
        .control-group select {
            padding: 6px 10px; border: 1px solid #2a2a4e; border-radius: 6px;
            background: #0f3460; color: #eee; font-size: 14px; cursor: pointer;
        }
        .control-group button {
            padding: 8px 14px; border: none; border-radius: 6px;
            background: #e94560; color: white; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: background 0.15s;
        }
        .control-group button:hover { background: #c81e45; }
        .control-group button:disabled { background: #333; opacity: 0.5; cursor: not-allowed; }
        .toggle-group {
            display: flex; align-items: center; gap: 6px;
        }
        .toggle-group label {
            margin: 0; font-size: 14px; color: #ccc; cursor: pointer;
        }
        .toggle-group input[type="checkbox"] {
            width: 20px; height: 20px; accent-color: #e94560; cursor: pointer;
        }
        .speed-group { min-width: 160px; flex: 1; max-width: 240px; }
        .speed-group input[type="range"] {
            width: 100%; cursor: pointer; accent-color: #e94560;
        }
        .btn-group { display: flex; gap: 8px; }

        @media (max-width: 768px) {
            .main-area { flex-direction: column; padding: 6px; gap: 6px; }
            .output-wrap { width: 100%; min-height: 80px; max-height: 140px; }
            .controls { padding: 8px; gap: 10px; }
            .speed-group { min-width: 120px; }
            .control-group select { font-size: 13px; }
            .canvas-stats { font-size: 10px; }
        }
        @media (max-width: 480px) {
            .controls { overflow-x: auto; flex-wrap: nowrap; }
            .controls::-webkit-scrollbar { display: none; }
            .toggle-group label { font-size: 13px; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="main-area">
        <div class="canvas-wrap">
            <canvas id="dasher-canvas" width="800" height="600"></canvas>
            <div class="canvas-stats">
                <span id="fps">FPS: 0</span> | <span id="frame-time">Frame: 0ms</span>
            </div>
        </div>
        <div class="output-wrap">
            <h2>Output</h2>
            <textarea id="output-text" readonly placeholder="Text appears here..."></textarea>
        </div>
    </div>
    <div class="controls">
        <div class="control-group">
            <label for="alphabet-select">Alphabet</label>
            <select id="alphabet-select" disabled></select>
        </div>
        <div class="control-group speed-group">
            <label for="speed-slider">Speed: <span id="speed-value">100</span>%</label>
            <input type="range" id="speed-slider" min="20" max="400" value="100" disabled>
        </div>
        <div class="toggle-group">
            <input type="checkbox" id="autospeed-toggle" disabled>
            <label for="autospeed-toggle">Auto speed</label>
        </div>
        <div class="toggle-group">
            <input type="checkbox" id="learning-toggle" disabled>
            <label for="learning-toggle">Learning</label>
        </div>
        <div class="btn-group">
            <button id="reset-btn" disabled>Clear</button>
            <button id="full-reset-btn" disabled>Reset</button>
        </div>
    </div>
</div>

    <script src="dasher-wasm-wrapper.js"></script>
    <script type="module">
        const canvas = document.getElementById('dasher-canvas');
        const ctx = canvas.getContext('2d');
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status');
        const outputText = document.getElementById('output-text');
        const alphabetSelect = document.getElementById('alphabet-select');
        const speedSlider = document.getElementById('speed-slider');
        const speedValue = document.getElementById('speed-value');
        const autospeedToggle = document.getElementById('autospeed-toggle');
        const learningToggle = document.getElementById('learning-toggle');
        const resetBtn = document.getElementById('reset-btn');
        const fullResetBtn = document.getElementById('full-reset-btn');
        const fpsDisplay = document.getElementById('fps');
        const frameTimeDisplay = document.getElementById('frame-time');

        let dasher = null;
        let isRunning = false;
        let frameCount = 0;
        let lastFpsTime = performance.now();

        function updateStatus(message, type) {
            if (statusText) statusText.textContent = message;
            if (statusContainer) statusContainer.className = 'status ' + (type || 'loading');
        }

        function enableControls() {
            alphabetSelect.disabled = false;
            speedSlider.disabled = false;
            autospeedToggle.disabled = false;
            learningToggle.disabled = false;
            resetBtn.disabled = false;
            fullResetBtn.disabled = false;
        }

        function updateOutput() {
            if (dasher) {
                outputText.value = dasher.getOutputText();
            }
        }

        async function initializeDasher() {
            try {
                updateStatus('Loading WebAssembly module...', 'loading');

                const dasherModule = await import('./wasm/dasher.js');
                const createModuleFunc = dasherModule.default;

                dasher = new DasherWasm();
                await dasher.init({
                    canvas: canvas,
                    moduleFactory: createModuleFunc,
                    onOutput: (eventType, text) => {
                        if (eventType === 0) {
                            updateOutput();
                        }
                    },
                    onMessage: (messageType, text) => {
                        console.log('Dasher message:', text);
                    }
                });

                updateStatus('Creating Dasher context...', 'loading');
                dasher.createContext();

                // setScreenSize triggers Realize() which loads alphabets/training/colours
                dasher.setScreenSize(canvas.width, canvas.height);
                dasher.setSpeed(parseInt(speedSlider.value));

                // Read engine defaults for auto-speed and learning
                const autospeedKey = dasher.findParameterKey('BP_AUTO_SPEEDCONTROL');
                const learningKey = dasher.findParameterKey('BP_LM_ADAPTIVE');
                if (autospeedKey >= 0) {
                    autospeedToggle.checked = dasher.getBoolParameter(autospeedKey);
                }
                if (learningKey >= 0) {
                    learningToggle.checked = dasher.getBoolParameter(learningKey);
                }

                // Populate alphabet dropdown from actual available alphabets
                const alphabets = dasher.getAlphabets();
                const currentAlpha = dasher.getAlphabet();
                alphabetSelect.innerHTML = '';
                alphabets.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    if (name === currentAlpha) opt.selected = true;
                    alphabetSelect.appendChild(opt);
                });

                updateStatus('DasherCore ready! Move your mouse over the canvas to type.', 'success');
                enableControls();
                isRunning = true;
                requestAnimationFrame(renderLoop);

            } catch (error) {
                updateStatus('Error: ' + error.message, 'error');
                console.error('Initialization error:', error);
            }
        }

        function renderLoop() {
            if (!isRunning || !dasher) return;

            const startTime = performance.now();

            try {
                dasher.frame(performance.now());
                updateOutput();

                const frameTime = performance.now() - startTime;
                frameCount++;
                const now = performance.now();
                const elapsed = now - lastFpsTime;
                if (elapsed >= 1000) {
                    const fps = Math.round((frameCount * 1000) / elapsed);
                    fpsDisplay.textContent = 'FPS: ' + fps;
                    frameTimeDisplay.textContent = 'Frame Time: ' + frameTime.toFixed(1) + 'ms';
                    frameCount = 0;
                    lastFpsTime = now;
                }
            } catch (error) {
                console.error('Render error:', error);
                updateStatus('Render error: ' + error.message, 'error');
                isRunning = false;
                return;
            }

            requestAnimationFrame(renderLoop);
        }

        // Mouse / touch input
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousemove', (e) => {
            if (dasher) {
                const { x, y } = getCanvasCoords(e);
                dasher.mouseMove(x, y);
            }
        });

        canvas.addEventListener('mousedown', () => { if (dasher) dasher.mouseDown(); });
        canvas.addEventListener('mouseup', () => { if (dasher) dasher.mouseUp(); });
        canvas.addEventListener('mouseleave', () => { if (dasher) dasher.mouseUp(); });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (dasher) {
                const { x, y } = getCanvasCoords(e);
                dasher.mouseMove(x, y);
                dasher.mouseDown();
            }
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (dasher) {
                const { x, y } = getCanvasCoords(e);
                dasher.mouseMove(x, y);
            }
        });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (dasher) dasher.mouseUp();
        });

        // Control events
        alphabetSelect.addEventListener('change', (e) => {
            if (dasher) dasher.setAlphabet(e.target.value);
        });

        speedSlider.addEventListener('input', (e) => {
            speedValue.textContent = e.target.value;
            if (dasher) dasher.setSpeed(parseInt(e.target.value));
        });

        autospeedToggle.addEventListener('change', (e) => {
            if (dasher) {
                const key = dasher.findParameterKey('BP_AUTO_SPEEDCONTROL');
                if (key >= 0) dasher.setBoolParameter(key, e.target.checked);
            }
        });

        learningToggle.addEventListener('change', (e) => {
            if (dasher) {
                const key = dasher.findParameterKey('BP_LM_ADAPTIVE');
                if (key >= 0) dasher.setBoolParameter(key, e.target.checked);
            }
        });

        resetBtn.addEventListener('click', () => {
            if (dasher) { dasher.resetOutputText(); updateOutput(); }
        });

        fullResetBtn.addEventListener('click', () => {
            if (dasher) { dasher.reset(); updateOutput(); }
        });

        // Placeholder while loading
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#666';
        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Loading DasherCore...', canvas.width / 2, canvas.height / 2);

        // Responsive canvas: sync resolution to display size
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const w = Math.round(rect.width);
            const h = Math.round(rect.height);
            if (w > 0 && h > 0 && (w !== canvas.width || h !== canvas.height)) {
                canvas.width = w;
                canvas.height = h;
                if (dasher && isRunning) {
                    dasher.setScreenSize(w, h);
                }
            }
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
        const resizeObserver = new ResizeObserver(resizeCanvas);
        resizeObserver.observe(canvas);
        resizeCanvas();

        window.addEventListener('beforeunload', () => {
            if (dasher) dasher.destroy();
        });

        initializeDasher();
    </script>
</body>
</html>
