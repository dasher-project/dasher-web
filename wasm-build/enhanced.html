<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dasher — Enhanced Demo</title>
    <style>
        /* Design tokens: dasher-project/dasher-design-guide DESIGN.md (v6.0 alpha) */
        :root {
            --primary: #99D4CD;      /* Dasher Teal */
            --secondary: #F8E063;    /* Warm Yellow */
            --tertiary: #EB5B5C;     /* Coral Red */
            --text: #0F4B75;         /* Deep Navy */
            --bg: #F4F7F6;
            --surface: #FFFFFF;
            --border: #E0E6E8;
            --highlight: #E9F2F1;
            --text-dim: #5A7184;
            --canvas-bg: #FFFFFF;
            --stats: rgba(15, 75, 117, 0.45);
            --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
            --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
            --topbar-h: 64px; --statusbar-h: 48px; --touch: 48px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text: #FFFFFF;
                --bg: #12181B;
                --surface: #1E262B;
                --border: #2A353D;
                --highlight: #1D2D35;
                --text-dim: #9FB2BE;
                --canvas-bg: #12181B;
                --stats: rgba(255, 255, 255, 0.4);
            }
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            overflow: hidden;
        }
        button, select, input, textarea { font-family: inherit; }
        #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

        /* --- Top toolbar (64px): quick commands + status --- */
        .topbar {
            flex: none; height: var(--topbar-h);
            display: flex; align-items: center; gap: var(--sp-xs);
            padding: 0 var(--sp-md);
            background: var(--surface); border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex; align-items: baseline; gap: 6px;
            margin-right: var(--sp-md); user-select: none;
        }
        .brand strong { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.2px; }
        .brand span { font-size: 0.75rem; font-weight: 300; color: var(--text-dim); }
        .tool-btn {
            width: var(--touch); height: var(--touch);
            display: inline-flex; align-items: center; justify-content: center;
            border: none; background: transparent; border-radius: var(--radius-md);
            color: var(--text); cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .tool-btn:hover { background: var(--highlight); }
        .tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .tool-btn.active { background: var(--primary); color: #0F4B75; }
        .tool-btn svg { width: 24px; height: 24px; }
        .topbar .spacer { flex: 1; }
        .status-chip {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            padding: 4px 10px; border-radius: 999px; background: var(--highlight);
            white-space: nowrap;
        }

        /* --- Main area: canvas + editor pane --- */
        .main-area {
            flex: 1; display: flex; gap: var(--sp-sm); padding: var(--sp-sm);
            min-height: 0;
        }
        .canvas-wrap {
            flex: 1; display: flex; flex-direction: column;
            background: var(--canvas-bg);
            border: 1px solid var(--border); border-radius: var(--radius-lg);
            overflow: hidden; position: relative;
        }
        canvas {
            flex: 1; display: block; cursor: crosshair; touch-action: none;
            width: 100%;
        }
        .canvas-stats {
            position: absolute; bottom: var(--sp-sm); right: 12px;
            font-size: 11px; color: var(--stats); pointer-events: none;
        }
        .canvas-note {
            position: absolute; top: var(--sp-sm); left: 12px;
            font-size: 11px; color: var(--stats); pointer-events: none;
            max-width: 60%;
        }

        /* Editor pane (right) */
        .editor-pane {
            width: 300px; min-width: 220px; display: flex; flex-direction: column;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: var(--sp-md);
        }
        .editor-pane h2 {
            margin: 0 0 var(--sp-sm) 0; font-size: 1rem; font-weight: 500;
            color: var(--text);
        }
        #output-text {
            flex: 1; width: 100%; border: 1px solid var(--border);
            border-radius: var(--radius-md); background: var(--bg);
            color: var(--text); font-size: 1.0625rem; line-height: 1.5;
            resize: none; outline: none; padding: var(--sp-sm);
        }
        .editor-actions {
            display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-sm);
            margin-top: var(--sp-sm);
        }
        .editor-actions button {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: var(--touch); padding: 8px 10px;
            border: 1px solid var(--border); border-radius: var(--radius-md);
            background: var(--surface); color: var(--text);
            font-size: 0.875rem; cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .editor-actions button:hover { background: var(--highlight); }
        .editor-actions button.cta {
            background: var(--primary); color: #0F4B75; border-color: transparent;
            font-weight: 500; grid-column: 1 / -1;
        }
        .editor-actions button svg { width: 18px; height: 18px; }

        /* --- Bottom status bar (48px): micro-adjustments --- */
        .statusbar {
            flex: none; height: var(--statusbar-h);
            display: flex; align-items: center; gap: var(--sp-md);
            padding: 0 var(--sp-md);
            background: var(--surface); border-top: 1px solid var(--border);
            overflow-x: auto; scrollbar-width: none;
        }
        .statusbar::-webkit-scrollbar { display: none; }
        .status-field { display: flex; align-items: center; gap: 6px; flex: none; }
        .status-field > label {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            white-space: nowrap;
        }
        .status-field select, .status-field input[type="text"] {
            padding: 5px 8px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); background: var(--bg);
            color: var(--text); font-size: 0.8125rem;
        }
        .status-field select { max-width: 170px; }
        #alphabet-input { width: 190px; }
        .status-field input[type="range"] { width: 110px; accent-color: var(--primary); cursor: pointer; }
        .status-field input[type="number"] {
            width: 52px; padding: 5px 4px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); background: var(--bg);
            color: var(--text); font-size: 0.8125rem; text-align: center;
        }
        .switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .switch input {
            width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer;
        }
        .switch span { font-size: 0.8125rem; }
        .alpha-note { font-size: 0.6875rem; color: var(--text-dim); flex: 1; min-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 900px) {
            .main-area { flex-direction: column; }
            .editor-pane { width: 100%; min-height: 110px; max-height: 180px; }
            .editor-actions { display: flex; }
            .brand span { display: none; }
        }
        @media (max-width: 480px) {
            .brand { display: none; }
            .status-chip { display: none; }
        }

        /* --- Settings dialog --- */
        #settings-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(18, 24, 27, 0.5);
            display: flex; align-items: center; justify-content: center;
        }
        #settings-overlay[hidden] { display: none; }
        #settings-dialog {
            width: min(760px, 94vw); max-height: 88vh;
            display: flex; flex-direction: column;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); overflow: hidden;
        }
        .settings-head {
            display: flex; align-items: center; gap: 12px;
            padding: 14px var(--sp-md); border-bottom: 1px solid var(--border);
        }
        .settings-head h2 { margin: 0; font-size: 1.25rem; font-weight: 600; flex: 1; }
        .settings-head select {
            padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg); color: var(--text); font-size: 0.8125rem;
        }
        #settings-close {
            border: none; background: none; color: var(--text);
            font-size: 22px; cursor: pointer; padding: 0 6px; width: 40px; height: 40px;
        }
        #settings-body { overflow-y: auto; padding: var(--sp-xs) var(--sp-md) var(--sp-md); }
        .settings-section { margin-top: 14px; }
        .settings-section > h3 {
            margin: 0 0 8px 0; font-size: 0.8125rem; font-weight: 500;
            text-transform: uppercase; letter-spacing: 1px; color: var(--tertiary);
        }
        .settings-section > .section-note { font-size: 0.75rem; color: var(--text-dim); margin: 0 0 8px 0; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
        @media (max-width: 640px) { .settings-grid { grid-template-columns: 1fr; } }
        .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .setting-row .setting-label { font-size: 0.875rem; }
        .setting-row .setting-label small { display: block; color: var(--text-dim); font-size: 0.6875rem; }
        .setting-row input[type="checkbox"] {
            width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; flex: none;
        }
        .setting-row input[type="range"] { width: 130px; accent-color: var(--primary); }
        .setting-row input[type="number"] {
            width: 72px; padding: 4px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg); color: var(--text); font-size: 0.8125rem;
        }
        .setting-row select {
            max-width: 220px; padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg); color: var(--text); font-size: 0.8125rem;
        }
        .settings-advanced { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
        .settings-advanced summary {
            font-size: 0.75rem; color: var(--text-dim); cursor: pointer; user-select: none;
        }
        .settings-advanced .settings-grid { margin-top: 8px; }
        .settings-foot {
            display: flex; justify-content: flex-end; gap: 8px;
            padding: 12px var(--sp-md); border-top: 1px solid var(--border);
        }
        .settings-foot button {
            min-height: 44px; padding: 8px 14px; border: none; border-radius: var(--radius-md);
            background: var(--primary); color: #0F4B75; font-size: 0.875rem; font-weight: 500;
            cursor: pointer;
        }
        .settings-foot button:hover { box-shadow: 0 1px 4px rgba(15, 75, 117, 0.3); }

        /* Toast */
        #toast {
            position: fixed; bottom: calc(var(--statusbar-h) + var(--sp-sm));
            left: 50%; transform: translateX(-50%);
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 10px 16px; font-size: 0.875rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
            z-index: 200; max-width: 80vw;
        }
        #toast.show { opacity: 1; }
    </style>
</head>

<div id="app">
    <header class="topbar" role="toolbar" aria-label="Main toolbar">
        <div class="brand"><strong>Dasher</strong> <span>enhanced demo</span></div>
        <button class="tool-btn" id="tb-new" title="New — clear text and restart" aria-label="New" disabled>
            <svg><use href="#i-file-plus"/></svg></button>
        <button class="tool-btn" id="tb-open" title="Open a text file into the editor" aria-label="Open" disabled>
            <svg><use href="#i-folder-open"/></svg></button>
        <button class="tool-btn" id="tb-save" title="Save output as a text file" aria-label="Save" disabled>
            <svg><use href="#i-save"/></svg></button>
        <button class="tool-btn" id="tb-play" title="Play / pause" aria-label="Play or pause" disabled>
            <svg id="tb-play-icon"><use href="#i-play"/></svg></button>
        <button class="tool-btn" id="tb-position" title="Position — cycle screen orientation" aria-label="Position" disabled>
            <svg><use href="#i-flip-horizontal"/></svg></button>
        <div class="spacer"></div>
        <span class="status-chip" id="fps-chip">FPS: 0</span>
        <button class="tool-btn" id="tb-settings" title="Preferences" aria-label="Preferences" disabled>
            <svg><use href="#i-settings"/></svg></button>
    </header>

    <div class="main-area">
        <div class="canvas-wrap">
            <canvas id="dasher-canvas" width="800" height="600"></canvas>
            <div class="canvas-note" id="canvas-note"></div>
        </div>
        <aside class="editor-pane">
            <h2 id="editor-title">Output</h2>
            <textarea id="output-text" readonly placeholder="Text appears here..."></textarea>
            <div class="editor-actions">
                <button id="ed-copy" title="Copy output"><svg><use href="#i-copy"/></svg>Copy</button>
                <button id="ed-copy-all" title="Copy all output"><svg><use href="#i-clipboard-copy"/></svg>Copy all</button>
                <button id="ed-paste" title="Paste into the editor"><svg><use href="#i-clipboard-paste"/></svg>Paste</button>
                <button id="ed-speak" class="cta" title="Speak the output aloud"><svg><use href="#i-volume-2"/></svg>Quick speak</button>
            </div>
        </aside>
    </div>

    <footer class="statusbar" role="status" aria-label="Adjustment controls">
        <div class="status-field">
            <label for="alphabet-input" id="lbl-alphabet">Alphabet</label>
            <input type="text" id="alphabet-input" list="alphabet-list"
                placeholder="search…" disabled autocomplete="off">
            <input type="checkbox" id="trained-only" disabled title="Only alphabets with bundled training text"
                aria-label="Trained alphabets only">
            <label for="trained-only" id="lbl-trained" title="Only alphabets with bundled training text">★</label>
        </div>
        <div class="status-field">
            <label for="speed-slider" id="lbl-speed">Speed</label>
            <input type="range" id="speed-slider" min="20" max="400" value="100" disabled>
            <span id="speed-value" style="font-size:0.75rem;min-width:34px;">100%</span>
        </div>
        <div class="status-field">
            <label for="theme-select" id="lbl-theme">Theme</label>
            <select id="theme-select" disabled></select>
        </div>
        <div class="status-field">
            <label for="font-size" id="lbl-font">Font</label>
            <input type="number" id="font-size" min="8" max="72" step="1" value="0" disabled>
        </div>
        <label class="switch">
            <input type="checkbox" id="learning-toggle" disabled>
            <span id="lbl-learning">Learning</span>
        </label>
        <div class="alpha-note" id="alpha-note"></div>
    </footer>
</div>
<datalist id="alphabet-list"></datalist>

<div id="settings-overlay" hidden>
    <div id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-head">
            <h2 id="settings-title">Settings</h2>
            <select id="locale-select" title="Language"></select>
            <button id="settings-close" aria-label="Close">&times;</button>
        </div>
        <div id="settings-body"></div>
        <div class="settings-foot">
            <button id="settings-defaults">Reset all to defaults</button>
        </div>
    </div>
</div>
<div id="toast" role="status"></div>
<input type="file" id="file-input" accept=".txt,text/plain" hidden>

    <script src="dasher-wasm-wrapper.js"></script>
    <script type="module">
        const canvas = document.getElementById('dasher-canvas');
        const ctx = canvas.getContext('2d');
        const outputText = document.getElementById('output-text');
        const alphabetInput = document.getElementById('alphabet-input');
        const alphabetList = document.getElementById('alphabet-list');
        const trainedOnly = document.getElementById('trained-only');
        const alphaNote = document.getElementById('alpha-note');
        const themeSelect = document.getElementById('theme-select');
        const fontSizeInput = document.getElementById('font-size');
        const speedSlider = document.getElementById('speed-slider');
        const speedValue = document.getElementById('speed-value');
        const learningToggle = document.getElementById('learning-toggle');
        const fpsChip = document.getElementById('fps-chip');
        const canvasNote = document.getElementById('canvas-note');
        const toastEl = document.getElementById('toast');
        const fileInput = document.getElementById('file-input');
        const settingsOverlay = document.getElementById('settings-overlay');
        const settingsBody = document.getElementById('settings-body');
        const localeSelect = document.getElementById('locale-select');

        // Toolbar
        const tbNew = document.getElementById('tb-new');
        const tbOpen = document.getElementById('tb-open');
        const tbSave = document.getElementById('tb-save');
        const tbPlay = document.getElementById('tb-play');
        const tbPlayIcon = document.getElementById('tb-play-icon');
        const tbPosition = document.getElementById('tb-position');
        const tbSettings = document.getElementById('tb-settings');

        let dasher = null;
        let paused = false;
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let catalogue = [];
        let bundledAlphabets = [];
        let extraPrefix = '';   // text loaded via Open/Paste, shown before engine output
        const loadedFiles = new Set();

        function toast(message) {
            toastEl.textContent = message;
            toastEl.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
        }

        const displayText = () => extraPrefix + (dasher ? dasher.getOutputText() : '');
        function updateOutput() {
            outputText.value = displayText();
        }

        function enableControls() {
            alphabetInput.disabled = false;
            trainedOnly.disabled = false;
            themeSelect.disabled = false;
            fontSizeInput.disabled = false;
            speedSlider.disabled = false;
            learningToggle.disabled = false;
            tbNew.disabled = false;
            tbOpen.disabled = false;
            tbSave.disabled = false;
            tbPlay.disabled = false;
            tbPosition.disabled = false;
            tbSettings.disabled = false;
        }

        // ── Alphabet picker ──────────────────────────────────────────────

        function rebuildDatalist() {
            const filter = trainedOnly.checked;
            const options = [];
            for (const id of bundledAlphabets) {
                options.push(`<option value="${escapeAttr(id)}" label="bundled + trained">`);
            }
            for (const a of catalogue) {
                if (filter && !a.trained) continue;
                const label = a.trained ? 'trained' : `${a.script || ''}${a.chars ? ' · ' + a.chars + ' chars' : ''}`;
                options.push(`<option value="${escapeAttr(a.id)}" label="${escapeAttr(label)}">`);
            }
            alphabetList.innerHTML = options.join('');
        }

        const escapeAttr = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

        async function switchAlphabet(id) {
            if (!dasher || !id) return;
            try {
                if (!bundledAlphabets.includes(id) && !loadedFiles.has(id)) {
                    alphaNote.textContent = `Fetching ${id}…`;
                    const entry = catalogue.find((a) => a.id === id);
                    if (!entry) {
                        alphaNote.textContent = `“${id}” not found — pick from the list`;
                        return;
                    }
                    const xml = await fetchCatalogueFile(entry.file);
                    dasher.module.FS.writeFile('/data/alphabets/' + entry.file, xml);
                    loadedFiles.add(id);
                    dasher.setScreenSize(canvas.width, canvas.height);
                }
                dasher.setAlphabet(id);
                alphaNote.textContent = (dasher.getAlphabet() === id)
                    ? `Using: ${id}` : `Could not switch to ${id}`;
            } catch (e) {
                alphaNote.textContent = `Error: ${e.message || e}`;
            }
        }

        let catalogueRoot = null;
        async function fetchCatalogueFile(name) {
            if (!catalogueRoot) await loadCatalogueIndex();
            const resp = await fetch(catalogueRoot + name);
            if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${name}`);
            return resp.text();
        }

        async function loadCatalogueIndex() {
            for (const base of ['alphabet-catalogue/', '../alphabet-catalogue/']) {
                try {
                    const r = await fetch(base + 'index.json');
                    if (r.ok) {
                        const data = await r.json();
                        catalogue = data.alphabets || [];
                        catalogueRoot = base;
                        return;
                    }
                } catch (e) { /* try next */ }
            }
            catalogue = [];
        }

        alphabetInput.addEventListener('change', () => switchAlphabet(alphabetInput.value.trim()));
        trainedOnly.addEventListener('change', rebuildDatalist);

        // ── Locale (shared UI strings) ───────────────────────────────────

        let uiStrings = null;
        let locale = 'en';

        async function loadUiStrings() {
            for (const base of ['strings/', '../strings/']) {
                try {
                    const r = await fetch(base + 'ui-strings.json');
                    if (r.ok) { uiStrings = await r.json(); return; }
                } catch (e) { /* try next */ }
            }
            uiStrings = {meta: {locales: ['en']}, shared: {}};
        }

        const t = (key, fallback) => {
            const entry = uiStrings && uiStrings.shared[key];
            if (entry) return entry[locale] || entry.en || fallback || key;
            return fallback || key;
        };

        const localeName = (code) => {
            try {
                return new Intl.DisplayNames([locale], {type: 'language'}).of(code) || code;
            } catch (e) { return code; }
        };

        function buildLocaleSelect() {
            const locales = (uiStrings && uiStrings.meta.locales) || ['en'];
            localeSelect.innerHTML = '';
            for (const code of locales) {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = `${localeName(code)} (${code})`;
                if (code === locale) opt.selected = true;
                localeSelect.appendChild(opt);
            }
        }

        function applyLocale() {
            document.getElementById('editor-title').textContent = t('output', 'Output');
            document.getElementById('lbl-alphabet').textContent = t('alphabet', 'Alphabet');
            document.getElementById('lbl-speed').textContent = t('speed', 'Speed');
            document.getElementById('lbl-theme').textContent = t('theme', 'Theme');
            document.getElementById('lbl-font').textContent = t('font_size', 'Font');
            document.getElementById('lbl-learning').textContent = t('learning', 'Learning');
            tbNew.title = t('new', 'New — clear text and restart');
            tbSave.title = t('save', 'Save output as a text file');
            tbSettings.title = t('settings', 'Preferences');
            document.getElementById('ed-speak').lastChild.textContent = ' ' + t('quick_speak', 'Quick speak');
            rebuildSettings();
        }

        localeSelect.addEventListener('change', () => {
            locale = localeSelect.value || 'en';
            applyLocale();
        });

        // ── Toolbar actions ──────────────────────────────────────────────

        tbNew.addEventListener('click', () => {
            extraPrefix = '';
            if (dasher) { dasher.resetOutputText(); updateOutput(); }
            toast(t('new_cleared', 'Started a new message'));
        });

        tbOpen.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async () => {
            const file = fileInput.files && fileInput.files[0];
            fileInput.value = '';
            if (!file) return;
            const text = await file.text();
            extraPrefix = text;
            if (dasher) dasher.resetOutputText();
            updateOutput();
            toast(`${t('open', 'Opened')} ${file.name}`);
        });

        tbSave.addEventListener('click', () => {
            const blob = new Blob([displayText()], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'dasher-output.txt';
            a.click();
            URL.revokeObjectURL(a.href);
        });

        function setPaused(p) {
            paused = p;
            tbPlayIcon.innerHTML = `<use href="#i-${paused ? 'play' : 'pause'}"/>`;
            tbPlay.classList.toggle('active', paused);
        }
        tbPlay.addEventListener('click', () => setPaused(!paused));

        tbPosition.addEventListener('click', () => {
            if (!dasher) return;
            const key = dasher.findParameterKey('LP_ORIENTATION');
            if (key < 0) return;
            const enums = dasher.getParameterEnumValues(key);
            if (!enums.length) return;
            const current = dasher.getLongParameter(key);
            const idx = enums.findIndex((e) => e.value === current);
            const next = enums[(idx + 1 + enums.length) % enums.length];
            dasher.setLongParameter(key, next.value);
            toast(`${t('position', 'Position')}: ${next.name}`);
        });

        tbSettings.addEventListener('click', () => {
            rebuildSettings();
            settingsOverlay.hidden = false;
        });

        // ── Editor pane actions ─────────────────────────────────────────

        document.getElementById('ed-copy').addEventListener('click', async () => {
            const sel = outputText.value.substring(outputText.selectionStart, outputText.selectionEnd);
            const text = sel || displayText();
            try { await navigator.clipboard.writeText(text); toast(t('copied', 'Copied')); }
            catch (e) { toast('Clipboard unavailable'); }
        });
        document.getElementById('ed-copy-all').addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(displayText()); toast(t('copied', 'Copied')); }
            catch (e) { toast('Clipboard unavailable'); }
        });
        document.getElementById('ed-paste').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                extraPrefix += text;
                updateOutput();
                toast(t('pasted', 'Pasted'));
            } catch (e) { toast('Clipboard unavailable — needs permission or HTTPS'); }
        });
        document.getElementById('ed-speak').addEventListener('click', () => {
            const text = displayText().trim();
            if (!text) { toast(t('nothing_to_speak', 'Nothing to speak yet')); return; }
            const u = new SpeechSynthesisUtterance(text);
            if (speechSynthesis.speaking) speechSynthesis.cancel();
            u.lang = locale;
            speechSynthesis.speak(u);
        });

        // ── Status bar ───────────────────────────────────────────────────

        themeSelect.addEventListener('change', () => {
            if (!dasher) return;
            const key = dasher.findParameterKey('SP_COLOUR_ID');
            if (key >= 0) dasher.setStringParameter(key, themeSelect.value);
        });

        fontSizeInput.addEventListener('change', () => {
            if (!dasher) return;
            const key = dasher.findParameterKey('LP_DASHER_FONTSIZE');
            if (key >= 0) dasher.setLongParameter(key, parseInt(fontSizeInput.value) || 12);
        });

        speedSlider.addEventListener('input', () => {
            speedValue.textContent = speedSlider.value + '%';
            if (dasher) dasher.setSpeed(parseInt(speedSlider.value));
        });

        learningToggle.addEventListener('change', () => {
            if (!dasher) return;
            const key = dasher.findParameterKey('BP_LM_ADAPTIVE');
            if (key >= 0) dasher.setBoolParameter(key, learningToggle.checked);
        });

        // ── Settings dialog (generated from the CAPI manifest) ──────────

        document.getElementById('settings-close').addEventListener('click', () => {
            settingsOverlay.hidden = true;
        });
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) settingsOverlay.hidden = true;
        });
        document.getElementById('settings-defaults').addEventListener('click', () => location.reload());

        const GROUP_ORDER = ['Input', 'Language', 'Appearance', 'Speed', 'Output'];
        const GROUP_KEYS = {
            'Input': 'settings_input', 'Language': 'settings_language',
            'Appearance': 'settings_appearance', 'Speed': 'settings_speed',
            'Output': 'settings_output', 'Other': 'settings_other',
            'Privacy': 'settings_privacy',
        };

        function makeControl(p) {
            const wrap = document.createElement('div');
            wrap.className = 'setting-row';
            const label = document.createElement('div');
            label.className = 'setting-label';
            label.textContent = p.name;
            if (p.desc) {
                const small = document.createElement('small');
                small.textContent = p.desc;
                label.appendChild(small);
            }
            wrap.appendChild(label);

            if (p.type === 0) {
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = dasher.getBoolParameter(p.key);
                cb.addEventListener('change', () => dasher.setBoolParameter(p.key, cb.checked));
                wrap.appendChild(cb);
            } else if (p.type === 1) {
                const enums = dasher.getParameterEnumValues(p.key);
                if (enums.length > 0 && p.uiType === 5) {
                    const sel = document.createElement('select');
                    const current = dasher.getLongParameter(p.key);
                    for (const e of enums) {
                        const opt = document.createElement('option');
                        opt.value = e.value;
                        opt.textContent = e.name;
                        if (e.value === current) opt.selected = true;
                        sel.appendChild(opt);
                    }
                    sel.addEventListener('change', () => {
                        dasher.setLongParameter(p.key, parseInt(sel.value));
                        syncStatusbar();
                    });
                    wrap.appendChild(sel);
                } else {
                    const num = document.createElement('input');
                    num.type = 'number';
                    num.min = p.min; num.max = p.max; num.step = p.step || 1;
                    num.value = dasher.getLongParameter(p.key);
                    num.style.width = '72px';
                    num.addEventListener('change', () => {
                        dasher.setLongParameter(p.key, parseInt(num.value) || 0);
                        syncStatusbar();
                    });
                    wrap.appendChild(num);
                }
            } else {
                const values = dasher.getParameterStringValues(p.key);
                if (values.length > 0) {
                    const sel = document.createElement('select');
                    const current = dasher.getStringParameter(p.key);
                    for (const v of values) {
                        const opt = document.createElement('option');
                        opt.value = v;
                        opt.textContent = v;
                        if (v === current) opt.selected = true;
                        sel.appendChild(opt);
                    }
                    sel.addEventListener('change', () => {
                        dasher.setStringParameter(p.key, sel.value);
                        syncStatusbar();
                    });
                    wrap.appendChild(sel);
                } else {
                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.value = dasher.getStringParameter(p.key);
                    inp.addEventListener('change', () =>
                        dasher.setStringParameter(p.key, inp.value));
                    wrap.appendChild(inp);
                }
            }
            return wrap;
        }

        function syncStatusbar() {
            const cKey = dasher.findParameterKey('SP_COLOUR_ID');
            const cVal = dasher.getStringParameter(cKey);
            if (cVal && [...themeSelect.options].some((o) => o.value === cVal)) themeSelect.value = cVal;
            const fKey = dasher.findParameterKey('LP_DASHER_FONTSIZE');
            if (fKey >= 0) fontSizeInput.value = dasher.getLongParameter(fKey);
        }

        function sectionEl(titleKey, fallback) {
            const section = document.createElement('div');
            section.className = 'settings-section';
            const h3 = document.createElement('h3');
            h3.textContent = t(titleKey, fallback);
            section.appendChild(h3);
            return section;
        }

        function rebuildSettings() {
            if (!dasher) return;
            settingsBody.innerHTML = '';

            const count = dasher.getParameterCount();
            const byGroup = new Map();
            for (let i = 0; i < count; i++) {
                const p = dasher.getParameterInfo(i);
                if (!p || !p.name) continue;
                const group = p.group && p.group !== '' ? p.group : 'Other';
                if (!byGroup.has(group)) byGroup.set(group, []);
                byGroup.get(group).push(p);
            }
            const groups = [...byGroup.keys()].sort((a, b) => {
                const ai = GROUP_ORDER.indexOf(a), bi = GROUP_ORDER.indexOf(b);
                return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi) || a.localeCompare(b);
            });

            for (const group of groups) {
                const params = byGroup.get(group);
                const section = sectionEl(GROUP_KEYS[group] || 'settings_other', group);
                const normal = params.filter((p) => !p.advanced);
                const advanced = params.filter((p) => p.advanced);

                if (normal.length) {
                    const grid = document.createElement('div');
                    grid.className = 'settings-grid';
                    for (const p of normal) grid.appendChild(makeControl(p));
                    section.appendChild(grid);
                }
                if (advanced.length) {
                    const det = document.createElement('details');
                    det.className = 'settings-advanced';
                    const sum = document.createElement('summary');
                    sum.textContent = t('advanced_settings', 'Advanced settings');
                    det.appendChild(sum);
                    const grid = document.createElement('div');
                    grid.className = 'settings-grid';
                    for (const p of advanced) grid.appendChild(makeControl(p));
                    det.appendChild(grid);
                    section.appendChild(det);
                }
                settingsBody.appendChild(section);
            }

            const privacy = sectionEl('settings_privacy', 'Privacy');
            const note = document.createElement('p');
            note.className = 'section-note';
            note.textContent = t('privacy_local_only',
                'This demo runs entirely in your browser. No analytics, no telemetry, ' +
                'and no data leaves your device. Settings live in the page session only.');
            privacy.appendChild(note);
            settingsBody.appendChild(privacy);
        }

        // ── Engine init ──────────────────────────────────────────────────

        async function initializeDasher() {
            try {
                canvasNote.textContent = 'Loading WebAssembly module…';

                const dasherModule = await import('./wasm/dasher.js');
                dasher = new DasherWasm();
                window.dasher = dasher; // debug/console access
                await dasher.init({
                    canvas: canvas,
                    moduleFactory: dasherModule.default,
                    onOutput: (eventType) => {
                        if (eventType === 0) updateOutput();
                    },
                    onMessage: (messageType, text) => {
                        console.log('Dasher message:', text);
                    }
                });

                canvasNote.textContent = 'Creating context…';
                dasher.createContext();

                try {
                    const resp = await fetch('data-bundle/colours/colour.webdemo.xml');
                    if (resp.ok && dasher.module && dasher.module.FS) {
                        dasher.module.FS.writeFile(
                            '/data/colours/colour.webdemo.xml', await resp.text());
                    }
                } catch (e) { /* not running from a source checkout */ }

                const colourKey = dasher.findParameterKey('SP_COLOUR_ID');
                if (colourKey >= 0) dasher.setStringParameter(colourKey, 'Web Demo');

                dasher.setScreenSize(canvas.width, canvas.height);
                dasher.setSpeed(parseInt(speedSlider.value));

                const autospeedKey = dasher.findParameterKey('BP_AUTO_SPEEDCONTROL');
                const learningKey = dasher.findParameterKey('BP_LM_ADAPTIVE');
                if (learningKey >= 0) learningToggle.checked = dasher.getBoolParameter(learningKey);

                // Theme options straight from the engine
                const palettes = dasher.getParameterStringValues(colourKey);
                themeSelect.innerHTML = '';
                for (const p of palettes) {
                    const opt = document.createElement('option');
                    opt.value = p; opt.textContent = p;
                    themeSelect.appendChild(opt);
                }
                themeSelect.value = dasher.getStringParameter(colourKey);

                const fontKey = dasher.findParameterKey('LP_DASHER_FONTSIZE');
                if (fontKey >= 0) fontSizeInput.value = dasher.getLongParameter(fontKey);

                bundledAlphabets = dasher.getAlphabets();
                await loadCatalogueIndex();
                await loadUiStrings();
                buildLocaleSelect();
                rebuildDatalist();
                alphabetInput.value = dasher.getAlphabet();
                alphaNote.textContent = `${bundledAlphabets.length} bundled + ${catalogue.length} catalogue`;
                canvasNote.textContent = '';
                applyLocale();

                enableControls();
                startRenderLoop();
            } catch (error) {
                canvasNote.textContent = 'Failed to load: ' + (error.message || error);
                console.error(error);
            }
        }

        // ── Input ────────────────────────────────────────────────────────

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousemove', (e) => {
            if (dasher && !paused) {
                const { x, y } = getCanvasCoords(e);
                dasher.mouseMove(x, y);
            }
        });
        canvas.addEventListener('mousedown', () => { if (dasher && !paused) dasher.mouseDown(); });
        canvas.addEventListener('mouseup', () => { if (dasher) dasher.mouseUp(); });
        canvas.addEventListener('mouseleave', () => { if (dasher) dasher.mouseUp(); });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (dasher && !paused) {
                const { x, y } = getCanvasCoords(e);
                dasher.mouseMove(x, y);
                dasher.mouseDown();
            }
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (dasher && !paused) {
                const { x, y } = getCanvasCoords(e);
                dasher.mouseMove(x, y);
            }
        }, { passive: false });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (dasher) dasher.mouseUp();
        }, { passive: false });

        // ── Render loop ─────────────────────────────────────────────────

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const w = Math.round(rect.width * dpr);
            const h = Math.round(rect.height * dpr);
            if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
                canvas.width = w;
                canvas.height = h;
                if (dasher) dasher.setScreenSize(w, h);
            }
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

        function renderLoop(time) {
            if (dasher && !paused) {
                dasher.frame(time);
                frameCount++;
                if (time - lastFpsTime >= 1000) {
                    fpsChip.textContent = `FPS: ${frameCount}`;
                    frameCount = 0;
                    lastFpsTime = time;
                }
            }
            requestAnimationFrame(renderLoop);
        }

        function startRenderLoop() {
            resizeCanvas();
            requestAnimationFrame(renderLoop);
        }

        ctx.fillStyle = '#F4F7F6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        initializeDasher();
    </script>
</body>
</html>
