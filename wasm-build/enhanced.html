<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dasher — Enhanced Demo</title>
    <style>
        /* Design tokens: dasher-project/dasher-design-guide DESIGN.md (v6.0 alpha) */
        :root {
            --primary: #99D4CD;      /* Dasher Teal */
            --secondary: #F8E063;    /* Warm Yellow */
            --tertiary: #EB5B5C;     /* Coral Red */
            --text: #0F4B75;         /* Deep Navy */
            --bg: #F4F7F6;
            --surface: #FFFFFF;
            --border: #E0E6E8;
            --highlight: #E9F2F1;
            --text-dim: #5A7184;
            --canvas-bg: #FFFFFF;
            --stats: rgba(15, 75, 117, 0.45);
            --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
            --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
            --topbar-h: 64px; --statusbar-h: 48px; --touch: 48px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text: #FFFFFF;
                --bg: #12181B;
                --surface: #1E262B;
                --border: #2A353D;
                --highlight: #1D2D35;
                --text-dim: #9FB2BE;
                --canvas-bg: #12181B;
                --stats: rgba(255, 255, 255, 0.4);
            }
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            overflow: hidden;
        }
        button, select, input, textarea { font-family: inherit; }
        #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

        /* --- Top toolbar (64px): quick commands + status --- */
        .topbar {
            flex: none; height: var(--topbar-h);
            display: flex; align-items: center; gap: var(--sp-xs);
            padding: 0 var(--sp-md);
            background: var(--surface); border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex; align-items: baseline; gap: 6px;
            margin-right: var(--sp-md); user-select: none;
        }
        .brand strong { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.2px; }
        .brand span { font-size: 0.75rem; font-weight: 300; color: var(--text-dim); }
        .tool-btn {
            width: var(--touch); height: var(--touch);
            display: inline-flex; align-items: center; justify-content: center;
            border: none; background: transparent; border-radius: var(--radius-md);
            color: var(--text); cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .tool-btn:hover { background: var(--highlight); }
        .tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .tool-btn.active { background: var(--primary); color: #0F4B75; }
        .tool-btn svg { width: 24px; height: 24px; }
        .topbar .spacer { flex: 1; }
        .status-chip {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            padding: 4px 10px; border-radius: 999px; background: var(--highlight);
            white-space: nowrap;
        }

        /* --- Main area: canvas + editor pane --- */
        .main-area {
            flex: 1; display: flex; gap: var(--sp-sm); padding: var(--sp-sm);
            min-height: 0;
        }
        .canvas-wrap {
            flex: 1; display: flex; flex-direction: column;
            background: var(--canvas-bg);
            border: 1px solid var(--border); border-radius: var(--radius-lg);
            overflow: hidden; position: relative;
        }
        canvas {
            flex: 1; display: block; cursor: crosshair; touch-action: none;
            width: 100%;
        }
        .canvas-stats {
            position: absolute; bottom: var(--sp-sm); right: 12px;
            font-size: 11px; color: var(--stats); pointer-events: none;
        }
        .canvas-note {
            position: absolute; top: var(--sp-sm); left: 12px;
            font-size: 11px; color: var(--stats); pointer-events: none;
            max-width: 60%;
        }

        /* Game mode overlay */
        #game-overlay {
            position: absolute; top: var(--sp-md); left: 50%; transform: translateX(-50%);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 10px 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            max-width: 86%; text-align: center; z-index: 5;
        }
        #game-overlay[hidden] { display: none; }
        #game-target {
            font-size: 1.0625rem; letter-spacing: 0.5px; line-height: 1.6;
            word-break: break-word;
        }
        #game-target .done { color: #1F8A70; font-weight: 600; }
        #game-target .todo { color: var(--text-dim); }
        #game-target .wrong { color: var(--tertiary); font-weight: 600; text-decoration: line-through; }
        #game-progress {
            margin-top: 6px; display: flex; align-items: center; gap: 12px; justify-content: center;
        }
        #game-stats { font-size: 0.75rem; color: var(--text-dim); }
        #game-exit {
            border: 1px solid var(--border); background: var(--highlight);
            color: var(--text); border-radius: var(--radius-sm);
            font-size: 0.75rem; padding: 4px 10px; cursor: pointer;
        }

        /* Editor pane (right) */
        .editor-pane {
            width: 300px; min-width: 220px; display: flex; flex-direction: column;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: var(--sp-md);
        }
        .editor-pane h2 {
            margin: 0 0 var(--sp-sm) 0; font-size: 1rem; font-weight: 500;
            color: var(--text);
        }
        #output-text {
            flex: 1; width: 100%; border: 1px solid var(--border);
            border-radius: var(--radius-md); background: var(--bg);
            color: var(--text); font-size: 1.0625rem; line-height: 1.5;
            resize: none; outline: none; padding: var(--sp-sm);
        }
        .editor-actions {
            display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-sm);
            margin-top: var(--sp-sm);
        }
        .editor-actions button {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: var(--touch); padding: 8px 10px;
            border: 1px solid var(--border); border-radius: var(--radius-md);
            background: var(--surface); color: var(--text);
            font-size: 0.875rem; cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .editor-actions button:hover { background: var(--highlight); }
        .editor-actions button.cta {
            background: var(--primary); color: #0F4B75; border-color: transparent;
            font-weight: 500; grid-column: 1 / -1;
        }
        .editor-actions button svg { width: 18px; height: 18px; }

        /* --- Bottom status bar (48px): micro-adjustments --- */
        .statusbar {
            flex: none; height: var(--statusbar-h);
            display: flex; align-items: center; gap: var(--sp-md);
            padding: 0 var(--sp-md);
            background: var(--surface); border-top: 1px solid var(--border);
            overflow-x: auto; scrollbar-width: none;
        }
        .statusbar::-webkit-scrollbar { display: none; }
        .status-field { display: flex; align-items: center; gap: 6px; flex: none; }
        .status-field > label {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            white-space: nowrap;
        }
        .status-field select, .status-field input[type="text"] {
            padding: 5px 8px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); background: var(--bg);
            color: var(--text); font-size: 0.8125rem;
        }
        .status-field select { max-width: 170px; }
        #alphabet-input { width: 190px; }
        .status-field input[type="range"] { width: 110px; accent-color: var(--primary); cursor: pointer; }
        .status-field input[type="number"] {
            width: 52px; padding: 5px 4px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); background: var(--bg);
            color: var(--text); font-size: 0.8125rem; text-align: center;
        }
        .switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .switch input {
            width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer;
        }
        .switch span { font-size: 0.8125rem; }
        .alpha-note { font-size: 0.6875rem; color: var(--text-dim); flex: 1; min-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 900px) {
            .main-area { flex-direction: column; }
            .editor-pane { width: 100%; min-height: 110px; max-height: 180px; }
            .editor-actions { display: flex; }
            .brand span { display: none; }
        }
        @media (max-width: 480px) {
            .brand { display: none; }
            .status-chip { display: none; }
        }

        .sb-sep { width: 1px; height: 24px; background: var(--border); flex: none; }
        .tb-sep { width: 1px; height: 32px; background: var(--border); flex: none; margin: 0 var(--sp-xs); }
        .speed-group { gap: 4px; }
        .step-btn {
            width: 28px; height: 28px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); background: var(--bg); color: var(--text);
            font-size: 0.9375rem; cursor: pointer; line-height: 1; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .step-btn:hover:not(:disabled) { background: var(--highlight); }
        .step-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .speed-value {
            min-width: 34px; text-align: center; font-size: 0.875rem;
            font-variant-numeric: tabular-nums;
        }
        .wpm-label {
            font-size: 0.8125rem; color: var(--text-dim);
            font-variant-numeric: tabular-nums; white-space: nowrap; flex: none;
        }
        .layout-picker { display: inline-flex; align-items: center; gap: 6px; height: var(--touch); }
        .layout-picker .layout-icon { width: 18px; height: 18px; color: var(--text); }
        .layout-picker select {
            padding: 8px 10px; border: 1px solid var(--border);
            border-radius: var(--radius-md); background: var(--bg);
            color: var(--text); font-size: 0.8125rem; cursor: pointer;
        }

        /* Output pane layouts (GTK parity: right / left / bottom / top) */
        .main-area { flex-direction: row; }
        .main-area.layout-left { flex-direction: row-reverse; }
        .main-area.layout-bottom { flex-direction: column; }
        .main-area.layout-top { flex-direction: column-reverse; }
        .main-area.layout-bottom .editor-pane,
        .main-area.layout-top .editor-pane {
            width: 100%; min-height: 110px; max-height: 170px;
        }
        .main-area.layout-bottom .editor-actions,
        .main-area.layout-top .editor-actions { display: flex; flex-wrap: wrap; }

        /* --- Settings dialog --- */
        #settings-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(18, 24, 27, 0.5);
            display: flex; align-items: center; justify-content: center;
        }
        #settings-overlay[hidden] { display: none; }
        #settings-dialog {
            width: min(760px, 94vw); max-height: 88vh;
            display: flex; flex-direction: column;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); overflow: hidden;
        }
        .settings-head {
            display: flex; align-items: center; gap: 12px;
            padding: 14px var(--sp-md); border-bottom: 1px solid var(--border);
        }
        .settings-head h2 { margin: 0; font-size: 1.25rem; font-weight: 600; flex: 1; }
        .settings-head select {
            padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg); color: var(--text); font-size: 0.8125rem;
        }
        #settings-close {
            border: none; background: none; color: var(--text);
            font-size: 22px; cursor: pointer; padding: 0 6px; width: 40px; height: 40px;
        }
        #settings-body { overflow-y: auto; padding: var(--sp-xs) var(--sp-md) var(--sp-md); }
        .settings-section { margin-top: 14px; }
        .settings-section > h3 {
            margin: 0 0 8px 0; font-size: 0.8125rem; font-weight: 500;
            text-transform: uppercase; letter-spacing: 1px; color: var(--tertiary);
        }
        .settings-tabs {
            display: flex; gap: var(--sp-xs); flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            margin: var(--sp-sm) calc(-1 * var(--sp-md)) var(--sp-md);
            padding: 0 var(--sp-md);
        }
        .settings-tab {
            border: none; background: none; color: var(--text-dim);
            font-size: 0.875rem; padding: 10px 12px; cursor: pointer;
            border-bottom: 2px solid transparent; margin-bottom: -1px;
        }
        .settings-tab:hover { color: var(--text); background: var(--highlight); }
        .settings-tab.active {
            color: var(--text); font-weight: 500;
            border-bottom-color: var(--tertiary);
        }
        .settings-panel[hidden] { display: none; }
        .settings-section > .section-note { font-size: 0.75rem; color: var(--text-dim); margin: 0 0 8px 0; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
        @media (max-width: 640px) { .settings-grid { grid-template-columns: 1fr; } }
        .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .setting-row .setting-label { font-size: 0.875rem; }
        .setting-row .setting-label small { display: block; color: var(--text-dim); font-size: 0.6875rem; }
        .setting-row input[type="checkbox"] {
            width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; flex: none;
        }
        .setting-row input[type="range"] { width: 130px; accent-color: var(--primary); }
        .setting-row input[type="number"] {
            width: 72px; padding: 4px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg); color: var(--text); font-size: 0.8125rem;
        }
        .setting-row select {
            max-width: 220px; padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg); color: var(--text); font-size: 0.8125rem;
        }
        .settings-advanced { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
        .settings-advanced summary {
            font-size: 0.75rem; color: var(--text-dim); cursor: pointer; user-select: none;
        }
        .settings-advanced .settings-grid { margin-top: 8px; }
        .settings-foot {
            display: flex; justify-content: flex-end; gap: 8px;
            padding: 12px var(--sp-md); border-top: 1px solid var(--border);
        }
        .settings-foot button {
            min-height: 44px; padding: 8px 14px; border: none; border-radius: var(--radius-md);
            background: var(--primary); color: #0F4B75; font-size: 0.875rem; font-weight: 500;
            cursor: pointer;
        }
        .settings-foot button:hover { box-shadow: 0 1px 4px rgba(15, 75, 117, 0.3); }

        /* Toast */
        #toast {
            position: fixed; bottom: calc(var(--statusbar-h) + var(--sp-sm));
            left: 50%; transform: translateX(-50%);
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 10px 16px; font-size: 0.875rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
            z-index: 200; max-width: 80vw;
        }
        #toast.show { opacity: 1; }
    </style>
</head>

<div id="app">
    <header class="topbar" role="toolbar" aria-label="Main toolbar">
        <div class="brand"><strong>Dasher</strong> <span>enhanced demo</span></div>
        <button class="tool-btn" id="tb-new" title="New — clear text and restart" aria-label="New" disabled>
            <svg><use href="#i-file-plus"/></svg></button>
        <button class="tool-btn" id="tb-open" title="Open a text file into the editor" aria-label="Open" disabled>
            <svg><use href="#i-folder-open"/></svg></button>
        <button class="tool-btn" id="tb-save" title="Save output as a text file" aria-label="Save" disabled>
            <svg><use href="#i-save"/></svg></button>
        <div class="tb-sep"></div>
        <button class="tool-btn" id="tb-game" title="Game mode — type the target text" aria-label="Game mode" disabled>
            <svg><use href="#i-gamepad-2"/></svg></button>
        <div class="layout-picker">
            <svg class="layout-icon"><use href="#i-panel-right"/></svg>
            <select id="layout-select" aria-label="Output pane position" disabled>
                <option value="right">Right side</option>
                <option value="left">Left side</option>
                <option value="bottom">Bottom</option>
                <option value="top">Top</option>
            </select>
        </div>
        <div class="tb-sep"></div>
        <button class="tool-btn" id="tb-settings" title="Preferences" aria-label="Preferences" disabled>
            <svg><use href="#i-settings"/></svg></button>
        <div class="spacer"></div>
        <span class="status-chip" id="fps-chip">FPS: 0</span>

    <div class="main-area">

                <div id="game-progress"><span id="game-stats"></span>
                    <button id="game-exit">Leave game mode</button>
                </div>

        <aside class="editor-pane">

<div id="toast" role="status"></div>
<input type="file" id="file-input" accept=".txt,text/plain" hidden>

    <script src="dasher-wasm-wrapper.js"></script>
    <script type="module">
        const canvas = document.getElementById('dasher-canvas');
        const ctx = canvas.getContext('2d');
        const outputText = document.getElementById('output-text');
        const alphabetInput = document.getElementById('alphabet-input');
        const alphabetList = document.getElementById('alphabet-list');
        const trainedOnly = document.getElementById('trained-only');
        const alphaNote = document.getElementById('alpha-note');
        const speedDown = document.getElementById('speed-down');
        const speedUp = document.getElementById('speed-up');
        const speedValue = document.getElementById('speed-value');
        const speechToggle = document.getElementById('speech-toggle');
        const layoutSelect = document.getElementById('layout-select');
        const wpmLabel = document.getElementById('wpm-label');
        const learningToggle = document.getElementById('learning-toggle');
        const fpsChip = document.getElementById('fps-chip');
        const canvasNote = document.getElementById('canvas-note');
        const toastEl = document.getElementById('toast');
        const fileInput = document.getElementById('file-input');
        const settingsOverlay = document.getElementById('settings-overlay');
        const settingsBody = document.getElementById('settings-body');
        const localeSelect = document.getElementById('locale-select');

        // Toolbar
        const tbNew = document.getElementById('tb-new');
        const tbOpen = document.getElementById('tb-open');
        const tbSave = document.getElementById('tb-save');
        const tbGame = document.getElementById('tb-game');
        const tbSettings = document.getElementById('tb-settings');
        const gameOverlay = document.getElementById('game-overlay');
        const gameTargetEl = document.getElementById('game-target');
        const gameStatsEl = document.getElementById('game-stats');

        let dasher = null;
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let catalogue = [];
        let bundledAlphabets = [];
        let extraPrefix = '';   // text loaded via Open/Paste, shown before engine output
        let gameTarget = '';    // cached target phrase
        const loadedFiles = new Set();

        function toast(message) {
            toastEl.textContent = message;
            toastEl.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
        }

        const displayText = () => extraPrefix + (dasher ? dasher.getOutputText() : '');
        function updateOutput() {
            outputText.value = displayText();
        }

        function enableControls() {
            alphabetInput.disabled = false;
            trainedOnly.disabled = false;
            speedDown.disabled = false;
            speedUp.disabled = false;
            learningToggle.disabled = false;
            speechToggle.disabled = false;
            layoutSelect.disabled = false;
            tbNew.disabled = false;
            tbOpen.disabled = false;
            tbSave.disabled = false;
            tbGame.disabled = false;
            tbSettings.disabled = false;
        }

        // ── Alphabet picker ──────────────────────────────────────────────

        function rebuildDatalist() {
            const filter = trainedOnly.checked;
            const options = [];
            for (const id of bundledAlphabets) {
                options.push(`<option value="${escapeAttr(id)}" label="bundled + trained">`);
            }
            for (const a of catalogue) {
                if (filter && !a.trained) continue;
                const label = a.trained ? 'trained' : `${a.script || ''}${a.chars ? ' · ' + a.chars + ' chars' : ''}`;
                options.push(`<option value="${escapeAttr(a.id)}" label="${escapeAttr(label)}">`);
            }
            alphabetList.innerHTML = options.join('');
        }

        const escapeAttr = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

        async function switchAlphabet(id) {
            if (!dasher || !id) return;
            try {
                if (!bundledAlphabets.includes(id) && !loadedFiles.has(id)) {
                    alphaNote.textContent = `Fetching ${id}…`;
                    const entry = catalogue.find((a) => a.id === id);
                    if (!entry) {
                        alphaNote.textContent = `“${id}” not found — pick from the list`;
                        return;
                    }
                    const xml = await fetchCatalogueFile(entry.file);
                    dasher.module.FS.writeFile('/data/alphabets/' + entry.file, xml);
                    loadedFiles.add(id);
                    dasher.setScreenSize(canvas.width, canvas.height);
                }
                dasher.setAlphabet(id);
                alphaNote.textContent = (dasher.getAlphabet() === id)
                    ? `Using: ${id}` : `Could not switch to ${id}`;
            } catch (e) {
                alphaNote.textContent = `Error: ${e.message || e}`;
            }
        }

        let catalogueRoot = null;
        async function fetchCatalogueFile(name) {
            if (!catalogueRoot) await loadCatalogueIndex();
            const resp = await fetch(catalogueRoot + name);
            if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${name}`);
            return resp.text();
        }

        async function loadCatalogueIndex() {
            for (const base of ['alphabet-catalogue/', '../alphabet-catalogue/']) {
                try {
                    const r = await fetch(base + 'index.json');
                    if (r.ok) {
                        const data = await r.json();
                        catalogue = data.alphabets || [];
                        catalogueRoot = base;
                        return;
                    }
                } catch (e) { /* try next */ }
            }
            catalogue = [];
        }

        alphabetInput.addEventListener('change', () => switchAlphabet(alphabetInput.value.trim()));
        trainedOnly.addEventListener('change', rebuildDatalist);

        // ── Locale (shared UI strings) ───────────────────────────────────

        let uiStrings = null;
        let locale = 'en';

        async function loadUiStrings() {
            for (const base of ['strings/', '../strings/']) {
                try {
                    const r = await fetch(base + 'ui-strings.json');
                    if (r.ok) { uiStrings = await r.json(); return; }
                } catch (e) { /* try next */ }
            }
            uiStrings = {meta: {locales: ['en']}, shared: {}};
        }

        const t = (key, fallback) => {
            const entry = uiStrings && uiStrings.shared[key];
            if (entry) return entry[locale] || entry.en || fallback || key;
            return fallback || key;
        };

        const localeName = (code) => {
            try {
                return new Intl.DisplayNames([locale], {type: 'language'}).of(code) || code;
            } catch (e) { return code; }
        };

        function buildLocaleSelect() {
            const locales = (uiStrings && uiStrings.meta.locales) || ['en'];
            localeSelect.innerHTML = '';
            for (const code of locales) {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = `${localeName(code)} (${code})`;
                if (code === locale) opt.selected = true;
                localeSelect.appendChild(opt);
            }
        }

        function applyLocale() {
            document.getElementById('editor-title').textContent = t('output', 'Output');
            document.getElementById('lbl-alphabet').textContent = t('alphabet', 'Alphabet');
            document.getElementById('lbl-speed').textContent = t('speed', 'Speed');
            document.getElementById('lbl-learning').textContent = t('learning', 'Learning');
            document.getElementById('lbl-speech').textContent = t('speech', 'Speech');
            document.getElementById('game-exit').textContent = t('leave_game_mode', 'Leave game mode');
            tbNew.title = t('new', 'New — clear text and restart');
            tbSave.title = t('save', 'Save output as a text file');
            tbSettings.title = t('settings', 'Preferences');
            const speakBtn = document.getElementById('ed-speak');
            if (speakBtn) speakBtn.lastChild.textContent = ' ' + t('quick_speak', 'Quick speak');
            rebuildSettings();
        }

        localeSelect.addEventListener('change', () => {
            locale = localeSelect.value || 'en';
            applyLocale();
        });

        // ── Toolbar actions ──────────────────────────────────────────────

        tbNew.addEventListener('click', () => {
            extraPrefix = '';
            if (dasher) { dasher.resetOutputText(); updateOutput(); }
            toast(t('new_cleared', 'Started a new message'));
        });

        tbOpen.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async () => {
            const file = fileInput.files && fileInput.files[0];
            fileInput.value = '';
            if (!file) return;
            const text = await file.text();
            extraPrefix = text;
            if (dasher) dasher.resetOutputText();
            updateOutput();
            toast(`${t('open', 'Opened')} ${file.name}`);
        });

        tbSave.addEventListener('click', () => {
            const blob = new Blob([displayText()], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'dasher-output.txt';
            a.click();
            URL.revokeObjectURL(a.href);
        });

        // Output-pane layout (GTK parity: right / left / bottom / top —
        // no keyboard/direct mode on the web)
        function setPaneLayout(layout) {
            const main = document.querySelector('.main-area');
            main.classList.remove('layout-right', 'layout-left', 'layout-bottom', 'layout-top');
            main.classList.add('layout-' + layout);
            layoutSelect.value = layout;
            try { localStorage.setItem('paneLayout', layout); } catch (e) { /* ignore */ }
            resizeCanvas();
        }
        layoutSelect.addEventListener('change', () => setPaneLayout(layoutSelect.value));
        {
            let stored = 'right';
            try { stored = localStorage.getItem('paneLayout') || 'right'; } catch (e) { /* ignore */ }
            setPaneLayout(stored);
        }

        tbSettings.addEventListener('click', () => {
            rebuildSettings();
            settingsOverlay.hidden = false;
        });

        // ── Game mode (RFC 0004 practice mode) ───────────────────────────

        function enterGame() {
            if (!dasher) return;
            dasher.resetCps && dasher.resetCps();
            if (!dasher.enterGameMode()) {
                toast('Game mode unavailable');
                return;
            }
            dasher.gameSetCanvasText(false); // we render the target ourselves
            gameTarget = dasher.getGameTargetText();
            gameOverlay.hidden = false;
            tbGame.classList.add('active');
            updateGamePanel();
        }

        function leaveGame() {
            if (!dasher) return;
            dasher.leaveGameMode();
            gameOverlay.hidden = true;
            tbGame.classList.remove('active');
        }

        tbGame.addEventListener('click', () => {
            if (dasher && dasher.gameModeActive()) leaveGame();
            else enterGame();
        });
        document.getElementById('game-exit').addEventListener('click', leaveGame);

        function updateGamePanel() {
            if (!dasher || gameOverlay.hidden) return;
            const target = dasher.getGameTargetText();
            if (target !== gameTarget && target) gameTarget = target;
            const correct = dasher.getGameCorrectCount();
            const total = dasher.getGameTargetLength() || gameTarget.length;
            const wrong = dasher.getGameWrongText();
            const done = gameTarget.slice(0, Math.max(0, correct));
            const todo = gameTarget.slice(Math.max(0, correct));
            gameTargetEl.innerHTML = '';
            const spanDone = document.createElement('span');
            spanDone.className = 'done'; spanDone.textContent = done;
            const spanTodo = document.createElement('span');
            spanTodo.className = 'todo'; spanTodo.textContent = todo;
            gameTargetEl.append(spanDone, spanTodo);
            if (wrong) {
                const spanWrong = document.createElement('span');
                spanWrong.className = 'wrong'; spanWrong.textContent = ' ' + wrong;
                gameTargetEl.appendChild(spanWrong);
            }
            const wpm = dasher.getWpm ? dasher.getWpm() : 0;
            gameStatsEl.textContent = `${correct}/${total} · ${wpm.toFixed(0)} wpm`;
        }

        // ── Typing rate (RFC 0012) ───────────────────────────────────────
        // Footer readout, GTK style: "0.0 cps · 0 wpm" at the end of the
        // bar, always visible when enabled (default on), updated at 2 Hz.
        // Zero at rest; keeps the last rate while idle, per the RFC.

        let showTypingRate = true;
        try {
            const stored = localStorage.getItem('showTypingRate');
            showTypingRate = stored === null ? true : stored === '1';
        } catch (e) { /* private mode */ }

        function applyTypingRateVisibility() {
            wpmLabel.style.display = showTypingRate ? '' : 'none';
        }
        applyTypingRateVisibility();

        setInterval(() => {
            if (!dasher || !dasher.getWpm) return;
            const cps = dasher.getCps();
            const wpm = dasher.getWpm();
            wpmLabel.textContent = `${cps.toFixed(1)} cps · ${Math.round(wpm)} wpm`;
        }, 500);

        // ── Editor pane actions ─────────────────────────────────────────

        document.getElementById('ed-copy').addEventListener('click', async () => {
            const sel = outputText.value.substring(outputText.selectionStart, outputText.selectionEnd);
            const text = sel || displayText();
            try { await navigator.clipboard.writeText(text); toast(t('copied', 'Copied')); }
            catch (e) { toast('Clipboard unavailable'); }
        });
        document.getElementById('ed-copy-all').addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(displayText()); toast(t('copied', 'Copied')); }
            catch (e) { toast('Clipboard unavailable'); }
        });
        document.getElementById('ed-paste').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                extraPrefix += text;
                updateOutput();
                toast(t('pasted', 'Pasted'));
            } catch (e) { toast('Clipboard unavailable — needs permission or HTTPS'); }
        });
        document.getElementById('ed-speak').addEventListener('click', () => {
            const text = displayText().trim();
            if (!text) { toast(t('nothing_to_speak', 'Nothing to speak yet')); return; }
            const u = new SpeechSynthesisUtterance(text);
            if (speechSynthesis.speaking) speechSynthesis.cancel();
            u.lang = locale;
            speechSynthesis.speak(u);
        });

        // ── Status bar ───────────────────────────────────────────────────

        // Theme selection stores a per-scheme preference; the OS can flip
        // between light and dark companions (RFC 0007)
        const DARK_COMPANIONS = new Map([
            ['Web Demo', 'Web Demo Dark'],
            ['Default', 'Default Dark'],
            ['Rainbow', 'Rainbow Dark'],
            ['European/Asian (Original)', 'European/Asian (Original) Dark'],
            ['European/Asian for Colourblind', 'European/Asian for Colourblind Dark'],
            ['Vowels', 'Vowels Dark'],
            ['Vowels2', 'Vowels2 Dark'],
            ['Thai', 'Thai Dark'],
            ['TurboLUT', 'TurboLUT Dark'],
        ]);
        for (const [light, dark] of [...DARK_COMPANIONS]) DARK_COMPANIONS.set(dark, light);

        const darkQuery = matchMedia('(prefers-color-scheme: dark)');
        darkQuery.addEventListener('change', () => {
            if (!dasher) return;
            const key = dasher.findParameterKey('SP_COLOUR_ID');
            if (key < 0) return;
            const current = dasher.getStringParameter(key);
            const companion = DARK_COMPANIONS.get(current);
            if (!companion) return;
            dasher.setStringParameter(key, companion);
        });

        // Speed stepper, Windows/GTK bottom-bar style: LP_MAX_BITRATE on
        // the v5 scale (raw / 100), range and step from the engine manifest.
        let speedStep = 0.1;
        {
            const key = dasher ? dasher.findParameterKey('LP_MAX_BITRATE') : -1;
            if (dasher && key >= 0) {
                for (let i = 0; i < dasher.getParameterCount(); i++) {
                    const info = dasher.getParameterInfo(i);
                    if (info && info.key === key) {
                        speedStep = Math.max(0.1, (info.step || 10) / 100);
                        break;
                    }
                }
            }
        }
        function currentSpeedV5() {
            if (!dasher) return 1.0;
            return dasher.getLongParameter(dasher.findParameterKey('LP_MAX_BITRATE')) / 100;
        }
        function updateSpeedDisplay() {
            speedValue.textContent = currentSpeedV5().toFixed(1);
        }
        function nudgeSpeed(delta) {
            if (!dasher) return;
            const key = dasher.findParameterKey('LP_MAX_BITRATE');
            const raw = dasher.getLongParameter(key);
            const next = Math.round(raw + delta * 100);
            dasher.setLongParameter(key, next);
            updateSpeedDisplay();
        }
        speedDown.addEventListener('click', () => nudgeSpeed(-speedStep));
        speedUp.addEventListener('click', () => nudgeSpeed(+speedStep));
        speedDown.title = speedUp.title =
            'Maximum writing speed, Dasher 5 scale (1.0 = 100).';

        learningToggle.addEventListener('change', () => {
            if (!dasher) return;
            const key = dasher.findParameterKey('BP_LM_ADAPTIVE');
            if (key >= 0) dasher.setBoolParameter(key, learningToggle.checked);
        });

        // Speech: speak the text typed in the current burst when the
        // pointer stops (mouseup), Windows/Apple speak-on-stop parity.
        let spokenAt = 0;
        speechToggle.addEventListener('change', () => {
            if (speechToggle.checked && !('speechSynthesis' in window)) {
                speechToggle.checked = false;
                toast('Speech synthesis unavailable in this browser');
            }
        });
        function speakNewText() {
            if (!speechToggle.checked || !('speechSynthesis' in window)) return;
            const text = displayText();
            if (text.length > spokenAt) {
                const delta = text.slice(spokenAt);
                spokenAt = text.length;
                if (delta.trim()) {
                    const u = new SpeechSynthesisUtterance(delta);
                    u.lang = locale;
                    if (speechSynthesis.speaking) speechSynthesis.cancel();
                    speechSynthesis.speak(u);
                }
            } else {
                spokenAt = text.length;
            }
        }

        // ── Settings dialog (generated from the CAPI manifest) ──────────

        document.getElementById('settings-close').addEventListener('click', () => {
            settingsOverlay.hidden = true;
        });
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) settingsOverlay.hidden = true;
        });
        document.getElementById('settings-defaults').addEventListener('click', () => location.reload());

        // RFC 0006: tabbed by usage context; the five top-level tabs come
        // from the manifest groups, Privacy (frontend-owned) last.
        const GROUP_ORDER = ['Input', 'Language', 'Output', 'Customization', 'Game Mode'];
        const GROUP_KEYS = {
            'Input': 'settings_input', 'Language': 'settings_language',
            'Appearance': 'settings_appearance', 'Speed': 'settings_speed',
            'Output': 'settings_output', 'Other': 'settings_other',
            'Privacy': 'settings_privacy',
        };

        function makeControl(p) {
            const wrap = document.createElement('div');
            wrap.className = 'setting-row';
            const label = document.createElement('div');
            label.className = 'setting-label';
            label.textContent = p.name;
            if (p.desc) {
                const small = document.createElement('small');
                small.textContent = p.desc;
                label.appendChild(small);
            }
            wrap.appendChild(label);

            if (p.type === 0) {
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = dasher.getBoolParameter(p.key);
                cb.addEventListener('change', () => dasher.setBoolParameter(p.key, cb.checked));
                wrap.appendChild(cb);
            } else if (p.type === 1) {
                const enums = dasher.getParameterEnumValues(p.key);
                if (enums.length > 0 && p.uiType === 5) {
                    const sel = document.createElement('select');
                    const current = dasher.getLongParameter(p.key);
                    for (const e of enums) {
                        const opt = document.createElement('option');
                        opt.value = e.value;
                        opt.textContent = e.name;
                        if (e.value === current) opt.selected = true;
                        sel.appendChild(opt);
                    }
                    sel.addEventListener('change', () => {
                        dasher.setLongParameter(p.key, parseInt(sel.value));
                        syncStatusbar();
                    });
                    wrap.appendChild(sel);
                } else {
                    const num = document.createElement('input');
                    num.type = 'number';
                    num.min = p.min; num.max = p.max; num.step = p.step || 1;
                    num.value = dasher.getLongParameter(p.key);
                    num.style.width = '72px';
                    num.addEventListener('change', () => {
                        dasher.setLongParameter(p.key, parseInt(num.value) || 0);
                        syncStatusbar();
                    });
                    wrap.appendChild(num);
                }
            } else {
                const values = dasher.getParameterStringValues(p.key);
                if (values.length > 0) {
                    const sel = document.createElement('select');
                    const current = dasher.getStringParameter(p.key);
                    for (const v of values) {
                        const opt = document.createElement('option');
                        opt.value = v;
                        opt.textContent = v;
                        if (v === current) opt.selected = true;
                        sel.appendChild(opt);
                    }
                    sel.addEventListener('change', () => {
                        dasher.setStringParameter(p.key, sel.value);
                        syncStatusbar();
                    });
                    wrap.appendChild(sel);
                } else {
                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.value = dasher.getStringParameter(p.key);
                    inp.addEventListener('change', () =>
                        dasher.setStringParameter(p.key, inp.value));
                    wrap.appendChild(inp);
                }
            }
            return wrap;
        }

        function syncStatusbar() {
            updateSpeedDisplay();
        }

        function sectionEl(titleKey, fallback) {
            const section = document.createElement('div');
            section.className = 'settings-section';
            const h3 = document.createElement('h3');
            h3.textContent = t(titleKey, fallback);
            section.appendChild(h3);
            return section;
        }

        function rebuildSettings() {
            if (!dasher) return;
            settingsBody.innerHTML = '';

            const count = dasher.getParameterCount();
            const byGroup = new Map();
            for (let i = 0; i < count; i++) {
                const p = dasher.getParameterInfo(i);
                if (!p || !p.name) continue;
                const group = p.group && p.group !== '' ? p.group : 'Other';
                if (!byGroup.has(group)) byGroup.set(group, []);
                byGroup.get(group).push(p);
            }
            const groups = [...byGroup.keys()].sort((a, b) => {
                const ai = GROUP_ORDER.indexOf(a), bi = GROUP_ORDER.indexOf(b);
                return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi) || a.localeCompare(b);
            });

            // Tab bar (RFC 0006): one tab per manifest group + Privacy
            const tabBar = document.createElement('div');
            tabBar.className = 'settings-tabs';
            tabBar.setAttribute('role', 'tablist');
            const panels = [];
            const tabs = [...groups, 'Privacy'];
            tabs.forEach((group, tabIndex) => {
                const tab = document.createElement('button');
                tab.className = 'settings-tab';
                tab.setAttribute('role', 'tab');
                tab.textContent = t(GROUP_KEYS[group] || 'settings_other', group);
                tab.addEventListener('click', () => {
                    tabBar.querySelectorAll('.settings-tab').forEach((b) => b.classList.remove('active'));
                    panels.forEach((pnl) => (pnl.hidden = true));
                    tab.classList.add('active');
                    panels[tabIndex].hidden = false;
                });
                tabBar.appendChild(tab);
                const panel = document.createElement('div');
                panel.className = 'settings-panel';
                panel.setAttribute('role', 'tabpanel');
                panel.hidden = tabIndex !== 0;
                panels.push(panel);
                if (tabIndex === 0) tab.classList.add('active');
                settingsBody.appendChild(panel);
            });
            settingsBody.insertBefore(tabBar, settingsBody.firstChild);

            groups.forEach((group, gi) => {
                const params = byGroup.get(group);
                const section = sectionEl(GROUP_KEYS[group] || 'settings_other', group);
                const normal = params.filter((p) => !p.advanced);
                const advanced = params.filter((p) => p.advanced);

                if (normal.length) {
                    const grid = document.createElement('div');
                    grid.className = 'settings-grid';
                    for (const p of normal) grid.appendChild(makeControl(p));
                    section.appendChild(grid);
                }
                if (advanced.length) {
                    const det = document.createElement('details');
                    det.className = 'settings-advanced';
                    const sum = document.createElement('summary');
                    sum.textContent = t('advanced_settings', 'Advanced settings');
                    det.appendChild(sum);
                    const grid = document.createElement('div');
                    grid.className = 'settings-grid';
                    for (const p of advanced) grid.appendChild(makeControl(p));
                    det.appendChild(grid);
                    section.appendChild(det);
                }
                panels[gi].appendChild(section);
            });

            const privacy = sectionEl('settings_privacy', 'Privacy');
            const note = document.createElement('p');
            note.className = 'section-note';
            note.textContent = t('privacy_local_only',
                'This demo runs entirely in your browser. No analytics, no telemetry, ' +
                'and no data leaves your device. Settings live in the page session only.');
            privacy.appendChild(note);

            // Typing-rate toggle (RFC 0012: frontend opt-in; game mode always shows it)
            const rateRow = document.createElement('div');
            rateRow.className = 'setting-row';
            const rateLabel = document.createElement('div');
            rateLabel.className = 'setting-label';
            rateLabel.textContent = t('show_typing_rate', 'Show typing rate (WPM)');
            const rateSmall = document.createElement('small');
            rateSmall.textContent = t('show_typing_rate_desc',
                'Live words-per-minute in the toolbar. Always shown in game mode.');
            rateLabel.appendChild(rateSmall);
            const rateCb = document.createElement('input');
            rateCb.type = 'checkbox';
            rateCb.checked = showTypingRate;
            rateCb.addEventListener('change', () => {
                showTypingRate = rateCb.checked;
                try { localStorage.setItem('showTypingRate', showTypingRate ? '1' : '0'); } catch (e) { /* ignore */ }
                applyTypingRateVisibility();
            });
            rateRow.append(rateLabel, rateCb);
            privacy.appendChild(rateRow);

            // Version row (RFC 0016)
            const versionRow = document.createElement('div');
            versionRow.className = 'setting-row';
            const versionLabel = document.createElement('div');
            versionLabel.className = 'setting-label';
            versionLabel.textContent = t('version', 'Version');
            const versionSmall = document.createElement('small');
            versionSmall.textContent = buildVersion;
            versionLabel.appendChild(versionSmall);
            versionRow.appendChild(versionLabel);
            privacy.appendChild(versionRow);

            panels[panels.length - 1].appendChild(privacy);
        }

        // Build/version info (RFC 0016): the BUILD file is staged next to
        // the demo by CI; absent on a plain source checkout.
        let buildVersion = 'development build';
        (async () => {
            for (const base of ['BUILD', '../BUILD']) {
                try {
                    const r = await fetch(base);
                    if (r.ok) {
                        const lines = (await r.text()).trim().split('\n');
                        const web = lines[0] || '';
                        const core = lines[1] || '';
                        buildVersion = `dasher-web ${web.replace('dasher-web ', '')} · DasherCore ${core}`.trim();
                        return;
                    }
                } catch (e) { /* try next */ }
            }
        })();

        // ── Engine init ──────────────────────────────────────────────────

        async function initializeDasher() {
            try {
                canvasNote.textContent = 'Loading WebAssembly module…';

                const dasherModule = await import('./wasm/dasher.js');
                dasher = new DasherWasm();
                window.dasher = dasher; // debug/console access
                await dasher.init({
                    canvas: canvas,
                    moduleFactory: dasherModule.default,
                    onOutput: (eventType) => {
                        if (eventType === 0) updateOutput();
                    },
                    onMessage: (messageType, text) => {
                        console.log('Dasher message:', text);
                    }
                });

                canvasNote.textContent = 'Creating context…';
                dasher.createContext();

                // Dev fallback: shipped builds embed data-bundle in the
                // .data file, but a local server may run against a stale
                // build — overlay the palette files before Realize loads
                // colours.
                try {
                    if (dasher.module && dasher.module.FS) {
                        const colourFiles = [
                            'colour.blue.xml', 'colour.ean.xml',
                            'colour.euroasian.xml', 'colour.euroasian2.xml',
                            'colour.jamie.xml', 'colour.rainbow.xml',
                            'colour.thai.xml', 'colour.turbo.xml',
                            'colour.vowels.xml', 'colour.vowels2.xml',
                            'colour.webdemo.xml', 'colour.webdemo.dark.xml',
                            'colour.default.dark.xml', 'colour.euroasian.dark.xml',
                            'colour.euroasian2.dark.xml', 'colour.rainbow.dark.xml',
                            'colour.thai.dark.xml', 'colour.turbo.dark.xml',
                            'colour.vowels.dark.xml', 'colour.vowels2.dark.xml',
                        ];
                        for (const f of colourFiles) {
                            const resp = await fetch('data-bundle/colours/' + f);
                            if (resp.ok) {
                                dasher.module.FS.writeFile('/data/colours/' + f, await resp.text());
                            }
                        }
                    }
                } catch (e) { /* not running from a source checkout */ }

                const colourKey = dasher.findParameterKey('SP_COLOUR_ID');
                if (colourKey >= 0) dasher.setStringParameter(colourKey, 'Web Demo');

                dasher.setScreenSize(canvas.width, canvas.height);
                updateSpeedDisplay();

                const learningKey = dasher.findParameterKey('BP_LM_ADAPTIVE');
                if (learningKey >= 0) learningToggle.checked = dasher.getBoolParameter(learningKey);

                // Appearance-aware palettes (RFC 0007): pick the stored (or
                // default) palette for the current scheme, and follow the OS
                // between companions. Palette choice itself lives in
                // Settings (GTK keeps appearance controls out of the bars).
                const palettes = dasher.getParameterStringValues(colourKey);
                const scheme = darkQuery.matches ? 'dark' : 'light';
                let stored = null;
                try { stored = localStorage.getItem('palette.' + scheme); } catch (e) { /* ignore */ }
                const fallback = scheme === 'dark' ? 'Web Demo Dark' : 'Web Demo';
                const preferred = palettes.includes(stored) ? stored
                    : (palettes.includes(fallback) ? fallback : palettes[0]);
                dasher.setStringParameter(colourKey, preferred);

                bundledAlphabets = dasher.getAlphabets();
                await loadCatalogueIndex();
                await loadUiStrings();
                buildLocaleSelect();
                rebuildDatalist();
                alphabetInput.value = dasher.getAlphabet();
                alphaNote.textContent = `${bundledAlphabets.length} bundled + ${catalogue.length} catalogue`;
                canvasNote.textContent = '';
                applyLocale();

                enableControls();
                startRenderLoop();
            } catch (error) {
                canvasNote.textContent = 'Failed to load: ' + (error.message || error);
                console.error(error);
            }
        }

        // ── Input ────────────────────────────────────────────────────────

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousemove', (e) => {
            if (dasher) {
                const { x, y } = getCanvasCoords(e);
                dasher.mouseMove(x, y);
            }
        });
        canvas.addEventListener('mousedown', () => { if (dasher) dasher.mouseDown(); });
        canvas.addEventListener('mouseup', () => { if (dasher) { dasher.mouseUp(); speakNewText(); } });
        canvas.addEventListener('mouseleave', () => { if (dasher) dasher.mouseUp(); });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (dasher) {
                const { x, y } = getCanvasCoords(e);
                dasher.mouseMove(x, y);
                dasher.mouseDown();
            }
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (dasher) {
                const { x, y } = getCanvasCoords(e);
                dasher.mouseMove(x, y);
            }
        }, { passive: false });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (dasher) { dasher.mouseUp(); speakNewText(); }
        }, { passive: false });

        // ── Render loop ─────────────────────────────────────────────────

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const w = Math.round(rect.width * dpr);
            const h = Math.round(rect.height * dpr);
            if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
                canvas.width = w;
                canvas.height = h;
                if (dasher) dasher.setScreenSize(w, h);
            }
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

        function renderLoop(time) {
            if (dasher) {
                dasher.frame(time);
                frameCount++;
                if (time - lastFpsTime >= 1000) {
                    fpsChip.textContent = `FPS: ${frameCount}`;
                    frameCount = 0;
                    lastFpsTime = time;
                }
                updateGamePanel();
            }
            requestAnimationFrame(renderLoop);
        }

        function startRenderLoop() {
            resizeCanvas();
            requestAnimationFrame(renderLoop);
        }

        ctx.fillStyle = '#F4F7F6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        initializeDasher();
    </script>
</body>
