name: Build and Deploy Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify emcc
        run: emcc --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build WASM module
        working-directory: wasm-build
        run: bash build.sh

      - name: Record build metadata
        run: |
          cd wasm-build
          echo "dasher-web $(git -C .. rev-parse --short HEAD)" > BUILD
          git -C dashercore-src describe --tags --always >> BUILD || true
          date -u +%Y-%m-%dT%H:%M:%SZ >> BUILD

      - name: Stage demo for Pages
        run: |
          mkdir -p _site
          cp wasm-build/demo.html _site/index.html
          cp wasm-build/dasher-wasm-wrapper.js _site/
          cp -r wasm-build/wasm _site/wasm
          # Enhanced playground (themes, node shapes, full alphabet
          # catalogue with lazy loading) at /js-demo/ — self-contained
          # copy of the engine assets so relative paths resolve.
          mkdir -p _site/js-demo
          cp wasm-build/enhanced.html _site/js-demo/index.html
          cp wasm-build/dasher-wasm-wrapper.js _site/js-demo/
          cp -r wasm-build/wasm _site/js-demo/wasm
          # Static alphabet catalogue, fetched on demand by the playground
          cp -r wasm-build/alphabet-catalogue _site/alphabet-catalogue
          # Shared UI string catalogue (33 locales) for the settings dialog
          cp -r wasm-build/strings _site/strings
          # Build metadata for the Settings → Privacy version row (RFC 0016)
          cp wasm-build/BUILD _site/BUILD
          cp wasm-build/BUILD _site/js-demo/BUILD
          touch _site/.nojekyll

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
